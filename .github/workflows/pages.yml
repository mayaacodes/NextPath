name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build authoritative school directory
        run: |
          for attempt in 1 2 3; do
            if python scripts/school_directory/build_school_directory.py --download --output docs/data/school-directory.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "School-directory download failed on attempt $attempt. Retrying..."
              sleep 15
            fi
          done
          echo "School-directory download failed after 3 attempts."
          exit 1

      - name: Validate deployable school directory
        run: python -m scripts.school_directory.validate_school_directory --directory docs/data/school-directory.json --require-production-ready

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
